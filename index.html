<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080817">
  <meta name="description" content="MyFlipperGame - Neon pinball">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyFlipper">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>MyFlipperGame</title>
  <script src="game.js" defer></script>
  <script>
    // PWA Install Prompt
    let deferredPrompt;
    const installBanner = document.createElement('div');
    installBanner.id = 'installBanner';
    installBanner.style.cssText = `
      position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
      background:#10102b;border:1px solid #35f6ff;border-radius:12px;
      padding:12px 16px;color:#fff;font:14px system-ui;z-index:1000;
      display:none;align-items:center;gap:12px;box-shadow:0 0 20px #35f6ff88;
      max-width:90vw;text-align:center;
    `;
    installBanner.innerHTML = `
      <span>Install MyFlipperGame for offline play</span>
      <button id="installBtn" style="
        background:#35f6ff;color:#080817;border:none;border-radius:6px;
        padding:8px 16px;font:bold 13px system-ui;cursor:pointer;
      ">Install</button>
      <button id="dismissBtn" style="
        background:transparent;color:#aaa;border:none;font:13px system-ui;cursor:pointer;
      ">✕</button>
    `;
    document.body.appendChild(installBanner);

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      // Show after brief delay
      setTimeout(() => installBanner.style.display = 'flex', 3000);
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') installBanner.style.display = 'none';
      deferredPrompt = null;
    });

    document.getElementById('dismissBtn').addEventListener('click', () => {
      installBanner.style.display = 'none';
    });

    // Service Worker Registration & Auto-Update
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Check for updates on load
        reg.update();

        // Check periodically (every 30 min)
        setInterval(() => reg.update(), 30 * 60 * 1000);

        // Listen for new service worker
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              // New version ready - show update toast
              showUpdateToast();
            }
          });
        });
      });

      // Listen for controller change (new SW took over)
      let lastVersion = null;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      // Get version from SW
      navigator.serviceWorker.ready.then(reg => {
        const channel = new MessageChannel();
        channel.port1.onmessage = e => {
          lastVersion = e.data.version;
        };
        reg.active.postMessage('getVersion', [channel.port2]);
      });
    }

    function showUpdateToast() {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        background:#10102b;border:1px solid #ff39d4;border-radius:12px;
        padding:20px 24px;color:#fff;font:15px system-ui;z-index:2000;
        text-align:center;box-shadow:0 0 30px #ff39d488;max-width:90vw;
      `;
      toast.innerHTML = `
        <strong style="color:#ff39d4">New Version Ready!</strong><br><br>
        A new version of MyFlipperGame is available.<br>
        Click to refresh and update.
      `;
      toast.addEventListener('click', () => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(reg => {
            reg.waiting?.postMessage('skipWaiting');
          });
        }
      });
      document.body.appendChild(toast);
    }
  </script>
</head>
<body>
  <main class="game">
    <header class="topbar">
      <h1>MY<span>FLIPPER</span><b>!</b></h1>
      <div class="stats">
        <div>SCORE<strong id="score">0</strong></div>
        <div>BEST<strong id="best">0</strong></div>
        <div>BALLS<strong id="lives">4</strong></div>
      </div>
      <div class="settings" id="settingsBtn" aria-label="Settings">⚙</div>
    </header>

    <div class="settings-panel hidden" id="settingsPanel">
      <div class="setting-row">
        <span>🔊 Sound</span>
        <button id="soundToggle" class="toggle-btn" aria-pressed="true">ON</button>
      </div>
      <div class="setting-row">
        <span>📳 Vibration</span>
        <button id="vibrateToggle" class="toggle-btn" aria-pressed="true">ON</button>
      </div>
      <div class="setting-row">
        <span>⚡ Difficulty</span>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="normal">Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="setting-row">
        <span>🏆 High Scores</span>
        <button id="highScoresBtn" class="toggle-btn">VIEW</button>
      </div>
      <div class="setting-row">
        <span>🎯 Missions</span>
        <button id="missionsBtn" class="toggle-btn">VIEW</button>
      </div>
      <div class="setting-row">
        <span>📊 Levels</span>
        <button id="levelsBtn" class="toggle-btn">VIEW</button>
      </div>
      <button id="closeSettings" class="close-btn">CLOSE</button>
    </div>

    <div class="settings-panel hidden" id="levelsPanel">
      <h3 style="margin:0 0 8px;color:var(--pink);font-size:18px;text-align:center">SELECT LEVEL</h3>
      <canvas id="levelsCanvas" width="330" height="440" style="width:100%;border-radius:8px;background:#0a0a1e;cursor:pointer"></canvas>
      <button id="closeLevels" class="close-btn" style="margin-top:8px">CLOSE</button>
    </div>

    <section class="board">
      <canvas id="gameCanvas" aria-label="Pinball playfield"></canvas>

      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="overlayTitle">READY?</h2>
          <p id="overlayMessage">
            Hit the bumpers.<br>
            Build combos. Beat your best!
          </p>
          <button id="startBtn">START GAME ▶</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="leftBtn" class="control left">◀ LEFT FLIPPER</button>
      <button id="plungeBtn" class="control plunge">▲ PLUNGER</button>
      <button id="rightBtn" class="control right">RIGHT FLIPPER ▶</button>
    </section>

    <p class="help">Hold the buttons to flip · Keyboard: ← → or A / D · SPACE / W / ↑ charge plunger</p>
  </main>
</body>
</html>
