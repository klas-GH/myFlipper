<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#10102b"/>
      <stop offset="100%" stop-color="#080817"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ball" cx="50%" cy="40%" r="50%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#c7ffff"/>
      <stop offset="100%" stop-color="#35f6ff"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" fill="none" stroke="#35f6ff" stroke-width="16" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <rect x="103" y="358" width="154" height="20" fill="#35f6ff" transform="rotate(-17 180 368)"/>
    <rect x="255" y="358" width="154" height="20" fill="#ff39d4" transform="rotate(197 332 368)"/>
  </g>
  <circle cx="256" cy="205" r="60" fill="url(#ball)" filter="url(#glow)"/>
  <text x="256" y="455" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-weight="bold" font-size="44">MY</text>
  <text x="256" y="495" text-anchor="middle" fill="#ff39d4" font-family="system-ui, sans-serif" font-weight="bold" font-size="38">FLIPPER</text>
</svg>